name: build

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build desktop components
        shell: pwsh
        run: .\build.ps1 -DesktopOnly

  game-bar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build sensor broker
        shell: pwsh
        run: dotnet build SensorBroker\QuietMonitor.SensorBroker.csproj -c Release
      - name: Restore and build Xbox Game Bar widget
        shell: pwsh
        run: msbuild QuietMonitor.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false
